# TerraFirmaGreg-Modern 0.13.16 (MC 1.20.1 / Forge 47.4.28)
# 服务端由 itzg/minecraft-server 的 AUTO_CURSEFORGE 安装整合包，
# 客户端整合包由 AutoModpack 5.0.0-rc.2 分发（默认 HOLEPUNCH 模式，复用 Minecraft 端口）。
# 保留 version 键：老版本 docker-compose（v1）离开它会把文件当成 legacy 格式解析。
version: "3.8"

services:
  minecraft:
    image: itzg/minecraft-server:java17
    container_name: tfg-mc
    restart: unless-stopped
    # 保持 stdin 打开，才能在 docker attach 下用控制台输入指令
    stdin_open: true
    tty: true
    ports:
      - "${MC_PORT:-25565}:25565"
      # 语音聊天（Simple Voice Chat）走 UDP，端口由 data/config/voicechat/voicechat-server.properties
      # 的 port 决定（当前 24454）；改那个值要同步改这里，客户端始终按服务端配置的端口连。
      - "24454:24454/udp"
    environment:
      # ---------- 基础 ----------
      EULA: "TRUE"
      TZ: "${TZ:-Asia/Shanghai}"
      # ---------- 整合包来源 ----------
      TYPE: AUTO_CURSEFORGE
      CF_SLUG: "custom"
      CF_MODPACK_ZIP: /modpacks/TerraFirmaGreg-Modern-0.13.16-curseforge.zip
      CF_API_KEY: ${CF_API_KEY}
      CF_PARALLEL_DOWNLOADS: "8"
      # 镜像自带的排除表会通过 CurseForge API 逐个解析条目（本项目下会返回 403 而中断安装）；
      # 而且完整的 mod 集合必须留在服务端，客户端才能通过 AutoModpack 拿到与整合包一致的内容
      CF_EXCLUDE_INCLUDE_FILE: ""
      # 客户端专属 mod 不进服务端（客户端那份由 automodpack/host-modpack 提供）：
      # Blur / Cubes Without Borders / ItemPhysic Lite / Sodium Extras
      CF_EXCLUDE_MODS: "823106 975120 270441 558905"
      # 客户端专属 mod 被移到 host-modpack、GregTech 会自改 jar 名，
      # 都会让安装器判定「整合包文件缺失」并重装整包，这里整体放开
      CF_IGNORE_MISSING_FILES: |
        mods/*.jar
      # 整合包 manifest 里声明的是 Forge 47.4.13，这里对齐玩家客户端使用的 47.4.28；
      # 已经装过旧 loader 时必须强制重装，否则安装器认为 loader 就绪会直接跳过
      CF_MOD_LOADER_VERSION: "47.4.28"
      CF_FORCE_REINSTALL_MODLOADER: "true"
      # ---------- AutoModpack ----------
      # jar 通过 /mods 挂载由镜像复制进 /data/mods，不依赖 Modrinth 解析
      # ---------- JVM ----------
      INIT_MEMORY: "4G"
      MAX_MEMORY: "${MC_MEMORY:-10G}"
      JVM_XX_OPTS: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=130
        -XX:G1HeapRegionSize=8M
        -XX:G1ReservePercent=15
        -XX:InitiatingHeapOccupancyPercent=20
        -XX:+PerfDisableSharedMem
        -XX:+AlwaysPreTouch
      # ---------- server.properties ----------
      MOTD: "WELCOME TO GUETSEC'S TerraFirmaGreg"
      DIFFICULTY: normal
      ONLINE_MODE: "FALSE"
      MAX_PLAYERS: "8"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      SPAWN_PROTECTION: "16"
      # TFC 的出生点搜索 + 重度世界生成会长时间占满 tick，关掉看门狗避免被误杀
      MAX_TICK_TIME: "-1"
      # ---------- 其他 ----------
      ENABLE_RCON: "FALSE"
      ENABLE_QUERY: "FALSE"
      SNOOPER_ENABLED: "FALSE"
    volumes:
      - ./data:/data
      - ./modpacks:/modpacks:ro
      # AutoModpack jar：镜像启动时会把 /mods 下的东西复制进 /data/mods
      - ./client/automodpack-5.0.0-rc.2.jar:/mods/automodpack.jar:ro
      # 配置与「客户端专属 mod」入库，克隆后无需手工准备
      - ./automodpack/server.conf:/data/automodpack/server.conf
      # AutoModpack 会在 host-modpack 根下写 patch-notes.md，所以整个目录需要可写；
      # 仓库里这些文件由克隆者持有，首次启动前要 chown 1000:1000（见 README）
      - ./automodpack/host-modpack:/data/automodpack/host-modpack
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 60s
      timeout: 10s
      retries: 5
      # 首次安装要下 276 个 mod + 解压 overrides，给足时间
      start_period: 45m
    stop_grace_period: 120s
